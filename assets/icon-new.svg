<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="foodGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="200"/>
  
  <!-- Main content centered -->
  <g transform="translate(512, 512)">
    <!-- Plate/dish -->
    <ellipse cx="0" cy="80" rx="280" ry="60" fill="url(#plateGradient)" opacity="0.9"/>
    <ellipse cx="0" cy="75" rx="280" ry="55" fill="#FFFFFF"/>
    
    <!-- Fork on left -->
    <g transform="translate(-200, -50)">
      <rect x="-8" y="-120" width="16" height="200" rx="8" fill="#FFFFFF"/>
      <rect x="-30" y="-120" width="12" height="80" rx="6" fill="#FFFFFF"/>
      <rect x="-10" y="-120" width="12" height="80" rx="6" fill="#FFFFFF"/>
      <rect x="10" y="-120" width="12" height="80" rx="6" fill="#FFFFFF"/>
    </g>
    
    <!-- Spoon on right -->
    <g transform="translate(200, -50)">
      <rect x="-8" y="-120" width="16" height="200" rx="8" fill="#FFFFFF"/>
      <ellipse cx="0" cy="-140" rx="28" ry="35" fill="#FFFFFF"/>
    </g>
    
    <!-- Food items on plate -->
    <!-- Main dish (center) -->
    <circle cx="0" cy="50" r="80" fill="url(#foodGradient)"/>
    <circle cx="-20" cy="40" r="15" fill="#FF6347" opacity="0.8"/>
    <circle cx="25" cy="45" r="18" fill="#32CD32" opacity="0.8"/>
    <circle cx="10" cy="65" r="12" fill="#FFD700" opacity="0.9"/>
    
    <!-- Side items -->
    <ellipse cx="-100" cy="60" rx="35" ry="25" fill="#90EE90" opacity="0.9"/>
    <ellipse cx="100" cy="60" rx="35" ry="25" fill="#FFB347" opacity="0.9"/>
    
    <!-- Steam/heat lines above food -->
    <path d="M -60 -20 Q -60 -60 -40 -80" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 0 -30 Q 0 -70 20 -90" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 60 -20 Q 60 -60 80 -80" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements in corners -->
  <circle cx="120" cy="120" r="30" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="904" cy="120" r="40" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="120" cy="904" r="35" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="904" cy="904" r="30" fill="#FFFFFF" opacity="0.15"/>
</svg>
