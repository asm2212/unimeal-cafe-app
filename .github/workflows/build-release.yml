name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Generate Expo prebuild
        run: npx expo prebuild --platform android --clean
      
      - name: Build Android APK
        working-directory: android
        run: ./gradlew :app:assembleRelease
      
      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             unimeal-cafe-v${{ steps.version.outputs.VERSION }}.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: unimeal-cafe-v${{ steps.version.outputs.VERSION }}.apk
          name: UniMeal Cafe App v${{ steps.version.outputs.VERSION }}
          body_path: RELEASE_NOTES_v${{ steps.version.outputs.VERSION }}.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unimeal-cafe-v${{ steps.version.outputs.VERSION }}
          path: unimeal-cafe-v${{ steps.version.outputs.VERSION }}.apk
